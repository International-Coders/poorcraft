[[bin]]
name = "probe_n08_carve"
path = "../../tools/probe_n08_carve.rs"

[[bin]]
name = "probe_n08_cave"
path = "../../tools/probe_n08_cave.rs"

[[bin]]
name = "probe_n08_scene"
path = "../../tools/probe_n08_scene.rs"

[[bin]]
name = "probe_n08_plaza"
path = "../../tools/probe_n08_plaza.rs"

[[bin]]
name = "probe_n08_near"
