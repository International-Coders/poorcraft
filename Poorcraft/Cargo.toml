[workspace]
resolver = "2"
members = [
    "crates/lf_audio",
    "crates/lf_engine",
    "crates/lf_voxel",
    "crates/lf_worldgen",
    "crates/lf_game",
    "crates/lf_story",
    "crates/lf_lore",
    "crates/lf_npc",
    "crates/lf_chronicle",
    "crates/lf_modapi",
    "crates/lf_protocol",
    "crates/lf_server",
    "crates/lf_steam",
    "crates/lf_client",
    "crates/lf_assets",
    "crates/lf_vistest",
    "apps/loreforge",
    "apps/loreforge-server",
    "xtask",
]
exclude = ["mods"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

# Central version reference. Crates currently declare their own versions
# (no `workspace = true` inheritance yet); this table mirrors the deps that
# are actually used so it cannot drift into fiction again. Every entry is
# referenced by at least one crate manifest — prune aggressively when that
# changes. (P25: the old table listed ~14 deps nothing used: bevy_ecs,
# quinn, mlua, wasmtime, kira, reqwest, puffin, tokio, proptest, insta,
# rayon, postcard, ron.)
[workspace.dependencies]
lf_audio = { path = "crates/lf_audio" }
lf_lore = { path = "crates/lf_lore" }
# Windowing & graphics (version-locked trio: wgpu 24 / winit 0.30 / egui 0.31)
winit = "0.30"
wgpu = "24.0"
egui = "0.31"
egui-winit = "0.31"
egui-wgpu = "0.31"
epaint = "0.31"
# Math & voxel data
glam = "0.30"
bytemuck = { version = "1.16", features = ["derive"] }
fastnoise-lite = "1.1"
# Serialization (bincode is the wire/disk format everywhere)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
zstd = "0.13"
# Images & GPU plumbing
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.3"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Steam (version reference; lf_steam marks it optional in its own manifest)
steamworks = "0.12"
# Tests
tempfile = "3"
