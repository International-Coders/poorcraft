[package]
name = "pc3d_render"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "24.0"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pc3d_world = { path = "../pc3d_world" }
pc3d_assets = { path = "../pc3d_assets" }
pc3d_save = { path = "../pc3d_save" }
pc3d_core = { path = "../pc3d_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
