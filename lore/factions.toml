# Standard standing-change events (FACTIONS_OVERVIEW table).
[standing_events]
quest_complete = 15
quest_fail = -10
trade_ten_items = 2
attack_npc = -20
kill_npc = -35
destroy_structure_block = -5
build_faction_blocks = 3
discover_structure = 5
rival_honored = -10
